---
# Ansible collection runtime metadata
# Declares action_groups so playbooks can use:
#   module_defaults:
#     group/ibm.cloudcollection.ibm:
#       ibmcloud_api_key: "{{ lookup('env', 'IC_API_KEY') }}"
#       region: us-south

